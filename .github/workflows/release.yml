name: Build and Deploy — house_finder

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

# Los despliegues no se cancelan a mitad: un despliegue interrumpido puede dejar
# el contenedor del N100 a medias.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.13"

jobs:
  # ----------------------------------------------------------------
  # Build & push: imagen multi-stage del Dockerfile del repo
  # ----------------------------------------------------------------
  image:
    name: Build & Push Image
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
      sha_tag: ${{ steps.meta.outputs.sha_tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Compute image metadata
        id: meta
        run: |
          {
            echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/house-finder"
            echo "sha_tag=sha-$(echo "${GITHUB_SHA}" | cut -c1-7)"
            echo "ref_tag=$(echo "${GITHUB_REF_NAME}" | tr '/' '-')"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU (multi-arch cross-compilation)
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # El clúster es ARM64 (nodeSelector kubernetes.io/arch: arm64) y la imagen
      # base python:3.13-slim es multi-arch, así que se publica solo arm64.
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:latest-arm64
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.ref_tag }}
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.sha_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ----------------------------------------------------------------
  # Deploy: Kubernetes + GitHub Release (solo en tags v*)
  # ----------------------------------------------------------------
  deploy:
    name: Release & Deploy
    runs-on: ubuntu-latest
    needs: [image]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Kubeconfig
        uses: azure/k8s-set-context@v5
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG }}

      - name: Ensure namespace and GHCR pull secret exist
        run: |
          kubectl create namespace house-finder --dry-run=client -o yaml | kubectl apply -f -
          if ! kubectl get secret ghcr-login-secret -n house-finder >/dev/null 2>&1; then
            kubectl create secret docker-registry ghcr-login-secret -n house-finder \
              --docker-server=ghcr.io \
              --docker-username="${{ secrets.REGISTRY_USERNAME }}" \
              --docker-password="${{ secrets.REGISTRY_PASSWORD }}" \
              --docker-email="docker@github.com"
          fi

      - name: Sync alert credentials into the app Secret
        # Las credenciales y direcciones de alertas se guardan en GitHub Secrets
        # y se sincronizan con merge patch, preservando los secretos de la app.
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          EMAIL_SMTP_USERNAME: ${{ secrets.EMAIL_SMTP_USERNAME }}
          EMAIL_SMTP_PASSWORD: ${{ secrets.EMAIL_SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          set -euo pipefail
          ntfy_enabled=false
          email_enabled=false
          if grep -Eq '^[[:space:]]*ALERTS_ENABLED:[[:space:]]*"?true"?[[:space:]]*$' deploy/k8s/configmap.yaml; then
            ntfy_enabled=true
          fi
          if grep -Eq '^[[:space:]]*EMAIL_ALERTS_ENABLED:[[:space:]]*"?true"?[[:space:]]*$' deploy/k8s/configmap.yaml; then
            email_enabled=true
          fi
          if [ "$ntfy_enabled" = false ] && [ "$email_enabled" = false ]; then
            echo "Alertas desactivadas en el ConfigMap; no se sincronizan sus secretos."
            exit 0
          fi
          if [ "$ntfy_enabled" = true ] && [ -z "${NTFY_TOPIC:-}" ]; then
            echo "::error::ALERTS_ENABLED=true pero falta el secreto NTFY_TOPIC del repositorio."
            exit 1
          fi
          if [ "$email_enabled" = true ]; then
            if ! grep -Eq '^[[:space:]]*EMAIL_SMTP_HOST:[[:space:]]*"[^"]+"' deploy/k8s/configmap.yaml; then
              echo "::error::EMAIL_ALERTS_ENABLED=true requiere EMAIL_SMTP_HOST en el ConfigMap."
              exit 1
            fi
            if [ -z "${EMAIL_FROM:-}" ] || [ -z "${EMAIL_TO:-}" ]; then
              echo "::error::EMAIL_ALERTS_ENABLED=true requiere los secretos EMAIL_FROM y EMAIL_TO."
              exit 1
            fi
            if { [ -n "${EMAIL_SMTP_USERNAME:-}" ] && [ -z "${EMAIL_SMTP_PASSWORD:-}" ]; } || \
               { [ -z "${EMAIL_SMTP_USERNAME:-}" ] && [ -n "${EMAIL_SMTP_PASSWORD:-}" ]; }; then
              echo "::error::EMAIL_SMTP_USERNAME y EMAIL_SMTP_PASSWORD deben definirse juntos."
              exit 1
            fi
          fi
          if ! kubectl -n house-finder get secret house-finder-secrets >/dev/null 2>&1; then
            echo "::error::No existe el Secret house-finder-secrets (APIFY_TOKEN, DEEPSEEK_API_KEY...). Créalo antes de desplegar."
            exit 1
          fi
          payload=$(NTFY_ENABLED="$ntfy_enabled" EMAIL_ENABLED="$email_enabled" python3 -c 'import json,os; d={}; n=os.environ["NTFY_ENABLED"]=="true"; e=os.environ["EMAIL_ENABLED"]=="true"; d.update({"NTFY_TOPIC":os.environ["NTFY_TOPIC"],"NTFY_TOKEN":os.environ.get("NTFY_TOKEN","")} if n else {}); d.update({k:os.environ.get(k,"") for k in ("EMAIL_SMTP_USERNAME","EMAIL_SMTP_PASSWORD","EMAIL_FROM","EMAIL_TO")} if e else {}); print(json.dumps({"stringData":d}))')
          kubectl -n house-finder patch secret house-finder-secrets --type merge -p "$payload"
          echo "Secret de notificaciones sincronizado; los valores no se muestran."
          if [ "$ntfy_enabled" = true ]; then
            kubectl -n house-finder annotate deployment/house-finder \
              house-finder.io/alert-topic-sha="$(printf '%s' "$NTFY_TOPIC" | sha256sum | cut -c1-12)" \
              --overwrite 2>/dev/null || true
          fi
          if [ "$email_enabled" = true ]; then
            email_sha="$(printf '%s\n' "${EMAIL_SMTP_USERNAME:-}" "${EMAIL_SMTP_PASSWORD:-}" "$EMAIL_FROM" "$EMAIL_TO" | sha256sum | cut -c1-12)"
            kubectl -n house-finder annotate deployment/house-finder \
              house-finder.io/email-config-sha="$email_sha" \
              --overwrite 2>/dev/null || true
          fi

      - name: Apply Kubernetes manifests
        run: kubectl apply -k deploy/k8s

      # Tag inmutable por commit: el rollout no depende de :latest ni de la caché del nodo.
      - name: Pin deployment to the built image
        run: |
          kubectl -n house-finder set image deployment/house-finder \
            api=${{ needs.image.outputs.image }}:${{ needs.image.outputs.sha_tag }}

      - name: Wait for rollout to complete
        run: kubectl -n house-finder rollout status deployment/house-finder --timeout=180s

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
