name: Build and Deploy — house_finder

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

# Los despliegues no se cancelan a mitad: un despliegue interrumpido puede dejar
# el contenedor del N100 a medias.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.13"

jobs:
  # ----------------------------------------------------------------
  # Build & push: imagen multi-stage del Dockerfile del repo
  # ----------------------------------------------------------------
  image:
    name: Build & Push Image
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
      sha_tag: ${{ steps.meta.outputs.sha_tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Compute image metadata
        id: meta
        run: |
          {
            echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/house-finder"
            echo "sha_tag=sha-$(echo "${GITHUB_SHA}" | cut -c1-7)"
            echo "ref_tag=$(echo "${GITHUB_REF_NAME}" | tr '/' '-')"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU (multi-arch cross-compilation)
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # El destino es el N100 (x86_64): se publica solo linux/amd64.
      # Para volver a desplegar en el clúster ARM64, añade linux/arm64 aquí.
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.ref_tag }}
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.sha_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ----------------------------------------------------------------
  # Deploy al N100 por SSH + docker compose + GitHub Release (tags v*)
  # ----------------------------------------------------------------
  deploy:
    name: Release & Deploy (N100)
    runs-on: ubuntu-latest
    needs: [image]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # El N100 mantiene un checkout del repo (git pull) y levanta el compose de
      # deploy/n100 con el tag inmutable sha-<commit>.
      - name: Deploy to N100 via SSH
        uses: appleboy/ssh-action@v1
        env:
          IMAGE_TAG: ${{ needs.image.outputs.sha_tag }}
          APP_DIR: ${{ secrets.N100_DEPLOY_PATH }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        with:
          host: ${{ secrets.N100_HOST }}
          username: ${{ secrets.N100_USER }}
          key: ${{ secrets.N100_SSH_KEY }}
          port: ${{ secrets.N100_PORT || 22 }}
          envs: IMAGE_TAG,APP_DIR,REGISTRY_USERNAME,REGISTRY_PASSWORD
          command_timeout: 15m
          script: |
            set -euo pipefail
            APP_DIR="${APP_DIR:-$HOME/house_finder}"
            if [ ! -d "$APP_DIR/.git" ]; then
              echo "No hay checkout del repo en $APP_DIR." >&2
              echo "Créalo una vez con: git clone https://github.com/oaicstef/house_finder.git $APP_DIR" >&2
              exit 1
            fi
            cd "$APP_DIR"
            git fetch --prune origin
            git pull --ff-only
            cd deploy/n100
            chmod +x deploy.sh
            ./deploy.sh "$IMAGE_TAG"

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
