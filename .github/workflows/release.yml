name: Build and Deploy — house_finder

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

# Los despliegues no se cancelan a mitad: un despliegue interrumpido puede dejar
# el contenedor del N100 a medias.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.13"

jobs:
  # ----------------------------------------------------------------
  # Build & push: imagen multi-stage del Dockerfile del repo
  # ----------------------------------------------------------------
  image:
    name: Build & Push Image
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
      sha_tag: ${{ steps.meta.outputs.sha_tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compute image metadata
        id: meta
        run: |
          {
            echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/house-finder"
            echo "sha_tag=sha-$(echo "${GITHUB_SHA}" | cut -c1-7)"
            echo "ref_tag=$(echo "${GITHUB_REF_NAME}" | tr '/' '-')"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU (multi-arch cross-compilation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # El clúster es ARM64 (nodeSelector kubernetes.io/arch: arm64) y la imagen
      # base python:3.13-slim es multi-arch, así que se publica solo arm64.
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:latest-arm64
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.ref_tag }}
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.sha_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ----------------------------------------------------------------
  # Deploy: Kubernetes + GitHub Release (solo en tags v*)
  # ----------------------------------------------------------------
  deploy:
    name: Release & Deploy
    runs-on: ubuntu-latest
    needs: [image]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Kubeconfig
        uses: azure/k8s-set-context@v4
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG }}

      - name: Ensure namespace and GHCR pull secret exist
        run: |
          kubectl create namespace house-finder --dry-run=client -o yaml | kubectl apply -f -
          if ! kubectl get secret ghcr-login-secret -n house-finder >/dev/null 2>&1; then
            kubectl create secret docker-registry ghcr-login-secret -n house-finder \
              --docker-server=ghcr.io \
              --docker-username="${{ secrets.REGISTRY_USERNAME }}" \
              --docker-password="${{ secrets.REGISTRY_PASSWORD }}" \
              --docker-email="docker@github.com"
          fi

      - name: Apply Kubernetes manifests
        run: kubectl apply -k deploy/k8s

      # Tag inmutable por commit: el rollout no depende de :latest ni de la caché del nodo.
      - name: Pin deployment to the built image
        run: |
          kubectl -n house-finder set image deployment/house-finder \
            api=${{ needs.image.outputs.image }}:${{ needs.image.outputs.sha_tag }}

      - name: Wait for rollout to complete
        run: kubectl -n house-finder rollout status deployment/house-finder --timeout=180s

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
