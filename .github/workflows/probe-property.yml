name: Probe homeType filter

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install --quiet 'apify-client>=3,<4'
      - name: Compare chalet subtypes
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: |
          python - <<'PY'
          import json, os
          from collections import Counter
          from apify_client import ApifyClient

          TARGET = "111892839"
          client = ApifyClient(os.environ["APIFY_TOKEN"])
          BASE = {
              "operation": "sale",
              "propertyType": "homes",
              "country": "es",
              "latitude": 40.37876642147255,
              "longitude": -3.602295005978209,
              "distanceKm": 6,
              "maxPrice": "1000000",
              "minSize": "140",
          }

          def search(label, home_types, max_items):
              run_input = dict(BASE, maxItems=max_items, homeType=home_types)
              run = client.actor("igolaizola/idealista-scraper").call(run_input=run_input)
              dataset = getattr(run, "default_dataset_id", None) or run["defaultDatasetId"]
              items = list(client.dataset(dataset).iterate_items())
              codes = [str(item.get("propertyCode")) for item in items]
              types = Counter((item.get("detailedType") or {}).get("subTypology") for item in items)
              print(f"=== {label} ===")
              print("returned:", len(codes), "| target:", TARGET in codes,
                    "| index:", codes.index(TARGET) if TARGET in codes else None)
              print("subtypes:", types.most_common())

          chalets = ["semiDetachedHouse", "terracedHouse"]
          search("D chalets maxItems 40", chalets, 40)
          search("E chalets maxItems 100", chalets, 100)
          search("F chalets+detached maxItems 100", ["detachedHouse", *chalets], 100)
          PY
