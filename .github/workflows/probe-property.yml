name: Probe Fotocasa property subtypes

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install --quiet 'apify-client>=3,<4'
      - name: Dump Fotocasa type fields
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: |
          python - <<'PY'
          import json, os
          from apify_client import ApifyClient

          client = ApifyClient(os.environ["APIFY_TOKEN"])
          run = client.actor("igolaizola/fotocasa-scraper").call(run_input={
              "operation": "buy", "propertyType": "home",
              "location": "Madrid", "maxItems": 8,
          })
          dataset = getattr(run, "default_dataset_id", None) or run["defaultDatasetId"]
          items = list(client.dataset(dataset).iterate_items())
          print("items:", len(items))
          for item in items:
              print(json.dumps({
                  "propertyType": item.get("propertyType"),
                  "propertySubtype": item.get("propertySubtype"),
                  "purchaseType": item.get("purchaseType"),
                  "url": item.get("url"),
              }, ensure_ascii=False))
          PY
