name: Probe padel anywhere in the listing payload

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install --quiet 'apify-client>=3,<4'
      - name: Recursive scan
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, re, unicodedata
          from apify_client import ApifyClient

          TARGET = "111892839"
          client = ApifyClient(os.environ["APIFY_TOKEN"])

          def norm(text):
              text = unicodedata.normalize("NFD", str(text))
              return "".join(c for c in text if unicodedata.category(c) != "Mn").lower()

          run = client.actor("igolaizola/idealista-scraper").call(run_input={
              "propertyCodes": [TARGET], "country": "es",
              "operation": "sale", "propertyType": "homes",
          })
          ds = getattr(run, "default_dataset_id", None) or run["defaultDatasetId"]
          item = list(client.dataset(ds).iterate_items())[0]

          hits = []
          def walk(node, path=""):
              if isinstance(node, dict):
                  for key, value in node.items():
                      walk(value, f"{path}.{key}" if path else key)
              elif isinstance(node, list):
                  for index, value in enumerate(node):
                      walk(value, f"{path}[{index}]")
              elif isinstance(node, str):
                  if "padel" in norm(node):
                      hits.append((path, node[:300]))

          walk(item)
          print("padel hits:", len(hits))
          for path, text in hits[:10]:
              print(" -", path, "=>", text)

          details = item.get("_details") or {}
          more = details.get("moreCharacteristics") or {}
          print("moreCharacteristics:", json.dumps(more, ensure_ascii=False))
          print("features:", json.dumps(item.get("features"), ensure_ascii=False))
          print("description chars:", len(details.get("propertyComment") or ""))
          print("description head:", (details.get("propertyComment") or "")[:300])
          PY
