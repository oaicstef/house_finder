name: Probe comments and detail cost

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install --quiet 'apify-client>=3,<4'
      - name: Comments and timing
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: |
          python - <<'PY'
          import os, time
          from apify_client import ApifyClient

          TARGET = "111892839"
          CODES = [TARGET, "113025882", "113004737", "113023897", "113019740"]
          client = ApifyClient(os.environ["APIFY_TOKEN"])

          started = time.time()
          run = client.actor("igolaizola/idealista-scraper").call(run_input={
              "propertyCodes": CODES, "country": "es",
              "operation": "sale", "propertyType": "homes",
          })
          elapsed = time.time() - started
          ds = getattr(run, "default_dataset_id", None) or run["defaultDatasetId"]
          items = list(client.dataset(ds).iterate_items())
          print("codes:", len(CODES), "| items:", len(items), "| seconds:", round(elapsed, 1))

          target = next(i for i in items if str(i.get("propertyCode")) == TARGET)
          details = target.get("_details") or {}
          comments = details.get("comments") or []
          total = len(details.get("propertyComment") or "")
          print("comments:", len(comments))
          for index, comment in enumerate(comments):
              text = (comment or {}).get("propertyComment") or ""
              total += len(text)
              print(f"  [{index}] len={len(text)} padel={'padel' in text.lower() or 'pádel' in text.lower()}")
          print("total description chars:", total)
          PY
