apiVersion: v1
kind: ConfigMap
metadata:
  name: house-finder-config
  namespace: house-finder
  labels:
    app.kubernetes.io/name: house-finder
data:
  ENVIRONMENT: "production"
  LOG_LEVEL: "INFO"
  TIMEZONE: "Europe/Madrid"
  ENABLE_SCHEDULER: "true"

  # Proveedor de scraping: local | idealista-api (acceso aprobado) | apify | none.
  SCRAPER_PROVIDERS: "idealista=apify,fotocasa=local"
  SCRAPER_FALLBACK_TO_APIFY: "true"
  SCRAPER_MAX_ITEMS: "100"
  SCRAPER_MAX_PAGES: "5"
  SCRAPER_TIMEOUT_SECONDS: "20"
  SCRAPER_MAX_RETRIES: "2"
  SCRAPER_RATE_LIMIT_PER_MINUTE: "20"

  # Actores de Apify (solo para los portales con proveedor apify o de respaldo).
  APIFY_IDEALISTA_ACTOR: "igolaizola/idealista-scraper"
  APIFY_FOTOCASA_ACTOR: "igolaizola/fotocasa-scraper"
  SEARCH_OPERATION: "sale"
  APIFY_MAX_ITEMS: "100"
  APIFY_TIMEOUT_SECONDS: "600"
  APIFY_MAX_CHARGE_USD: "0.15"

  # Geocodificador de códigos postales (CartoCiudad, sin API key).
  GEOCODING_BASE_URL: "https://www.cartociudad.es/geocoder/api/geocoder"
  GEOCODING_TIMEOUT_SECONDS: "10"

  # Alertas push (ntfy) de viviendas nuevas del job de las 07:00.
  # NTFY_TOPIC y NTFY_TOKEN van en el Secret (no en git). Activa ALERTS_ENABLED
  # aquí y define ALERT_CLICK_URL para que la notificación abra la UI.
  NTFY_BASE_URL: "https://ntfy.sh"
  NTFY_PRIORITY: "3"
  ALERT_CLICK_URL: "https://oaichousefinder.duckdns.org"
  # NTFY_TOPIC y NTFY_TOKEN llegan al pod desde el Secret; el pipeline los
  # sincroniza en cada despliegue a partir de los secretos del repositorio
  # (NTFY_TOPIC / NTFY_TOKEN en GitHub). Con ALERTS_ENABLED=true y sin topic
  # el arranque falla (CONFIGURATION_ERROR) y el rollout no completa.
  ALERTS_ENABLED: "true"

  DEEPSEEK_BASE_URL: "https://api.deepseek.com"
  DEEPSEEK_MODEL: "deepseek-flash"
  DEEPSEEK_TIMEOUT_SECONDS: "60"
  RELEVANCE_THRESHOLD: "0.6"

  # Resultados en el volumen persistente.
  RESULTS_DIR: "/data/results"

  # Perfil único de búsqueda: job diario + UI + POST /api/v1/search-profile/run.
  # Cámbialo aquí y reinicia el pod; no requiere rebuild de la imagen.
  SEARCH_PROFILE_JSON: '{"location":"Madrid","portals":["idealista","fotocasa"],"max_price_eur":900000,"min_size_m2":140,"min_rooms":4,"max_results":50,"preferences":"Casa o chalet, padel cominitario, piscina comunitaria","must_have":["piscina"],"preferred_terms":["padel"],"home_types":["terracedHouse","semiDetachedHouse","detachedHouse"],"postal_code":"28031","radius_km":5,"min_year_built":2020,"max_energy_rating":"B"}'
