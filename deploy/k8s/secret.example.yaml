# Plantilla: NO guardes este fichero con valores reales en git.
#   kubectl -n house-finder create secret generic house-finder-secrets \
#     --from-literal=DEEPSEEK_API_KEY='sk-...' \
#     --from-literal=APIFY_TOKEN='apify_api_...' \
#     --from-literal=IDEALISTA_API_CLIENT_ID='...' \
#     --from-literal=IDEALISTA_API_CLIENT_SECRET='...' \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# NTFY_TOPIC (y NTFY_TOKEN si el topic está protegido) habilitan las alertas push
# del job de las 07:00; requieren además ALERTS_ENABLED=true en el ConfigMap.
# APIFY_TOKEN solo es necesario si algún portal usa el proveedor `apify`
# (SCRAPER_PROVIDERS); con `SCRAPER_PROVIDERS=fotocasa=local` basta DEEPSEEK_API_KEY.
# Las credenciales IDEALISTA_API_* solo se requieren con acceso aprobado y
# SCRAPER_PROVIDERS=idealista=idealista-api.
apiVersion: v1
kind: Secret
metadata:
  name: house-finder-secrets
  namespace: house-finder
  labels:
    app.kubernetes.io/name: house-finder
type: Opaque
stringData:
  APIFY_TOKEN: "apify_api_xxxxxxxxxxxxxxxxxxxx"
  DEEPSEEK_API_KEY: "sk-xxxxxxxxxxxxxxxxxxxx"
  IDEALISTA_API_CLIENT_ID: "..."
  IDEALISTA_API_CLIENT_SECRET: "..."
  NTFY_TOPIC: "casa-nueva-xxxxxxxxxxxxxxxxxxxx"
  NTFY_TOKEN: ""
