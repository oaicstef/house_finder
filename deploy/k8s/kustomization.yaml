apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: house-finder
resources:
  - namespace.yaml
  - configmap.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
# Crea el Secret antes de aplicar (ver deploy/k8s/README.md):
#   kubectl -n house-finder create secret generic house-finder-secrets \
#     --from-literal=APIFY_TOKEN='...' --from-literal=DEEPSEEK_API_KEY='...'
# Opcional: descomenta para versionar la plantilla (nunca con secretos reales).
#  - secret.example.yaml
images:
  - name: ghcr.io/oaicstef/house-finder
    newTag: latest
